name: Validate priority road pages
on:
  pull_request:
    paths:
      - "index.html"
      - "roads/**"
      - "tests/test_road_pages.py"
      - ".github/workflows/check-road-pages.yml"
  push:
    branches: [main]
    paths:
      - "roads/**"
      - "tests/test_road_pages.py"
jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify road pages and accessibility hooks
        run: python -m unittest discover -s tests -p 'test_road_pages.py' -v
