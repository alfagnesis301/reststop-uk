<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page not found | RestStop UK</title>
<meta name="description" content="The RestStop UK page you requested could not be found.">
<meta name="robots" content="noindex,follow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{--ink:#111916;--muted:#58645f;--green:#087943;--line:#d9dedb;--bg:#f3f5f3;--card:#fff}
*{box-sizing:border-box}
body{margin:0;font:16px/1.55 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:var(--bg)}
a{color:#075f3a}
header,main,footer{max-width:960px;margin:auto;padding:20px}
.brand{font-size:22px;font-weight:900;text-decoration:none;color:var(--ink)}
.brand b{background:var(--green);color:#fff;padding:3px 7px;border-radius:7px;margin-left:4px}
.wrap{min-height:68vh;display:grid;place-items:center}
.card{width:min(100%,720px);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px}
.code{font-size:14px;color:var(--muted);font-weight:800;letter-spacing:.08em;text-transform:uppercase}
h1{font-size:clamp(34px,6vw,58px);line-height:1.05;margin:.15em 0}
p{color:var(--muted);max-width:62ch}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.btn{display:inline-block;background:var(--green);color:#fff;text-decoration:none;font-weight:800;border-radius:10px;padding:11px 15px}
.btn.alt{background:#fff;color:var(--ink);border:1px solid var(--line)}
footer{color:var(--muted);font-size:13px;border-top:1px solid var(--line)}
</style>
</head>
<body>
<header>
  <a class="brand" href="/">RestStop <b>UK</b></a>
</header>
<main class="wrap">
  <section class="card">
    <div class="code">404 · Page not found</div>
    <h1>We couldn't find that page</h1>
    <p>The address may be incorrect, or the page may have moved. You can return to RestStop UK and search by road, town, postcode or location.</p>
    <div class="actions">
      <a class="btn" href="/">Search RestStop UK</a>
      <a class="btn alt" href="/roads/">Browse roads</a>
      <a class="btn alt" href="/countries/">Browse countries</a>
    </div>
  </section>
</main>
<footer>RestStop UK · UK-wide rest-stop directory.</footer>
</body>
</html>
