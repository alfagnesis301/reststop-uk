<style>
:root{
  --paper:#f1f3f0; --surface:#ffffff; --surface-2:#e7ebe7; --ink:#131917; --ink-2:#4a5550; --ink-3:#6c7872;
  --line:#d3d9d4; --line-2:#b9c2bc;
  --go:#0a6b3d; --go-hover:#085a33; --go-ink:#ffffff; --go-soft:#dff0e6;
  --mway:#1b4f9c; --aroad:#0a6b3d; --aroad-num:#ffd21f; --signal:#ffd21f;
  --stop:#b3261e; --stop-soft:#fbe4e2; --warn:#8a5300;
  --land:#e2e8e2; --sea:#d3e0e4; --coast:#c3cfc6; --road-casing:#ffffff;
  --shadow:0 1px 2px rgb(19 25 23 / .06), 0 6px 18px rgb(19 25 23 / .08);
  --r:14px; --r-sm:10px; --hdr:60px;
  --font:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --display:"Overpass","Atkinson Hyperlegible Next",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#0d1110; --surface:#161c1a; --surface-2:#202825; --ink:#e9eeeb; --ink-2:#a9b4af; --ink-3:#86928c;
    --line:#29332f; --line-2:#3a4641; --go:#11874f; --go-hover:#16a15f; --go-soft:#15352a;
    --stop:#f2958d; --stop-soft:#3a1c1a; --warn:#e5ad52;
    --land:#1a221f; --sea:#0f1618; --coast:#2c3833; --road-casing:#0d1110;
    --shadow:0 1px 2px rgb(0 0 0 / .4), 0 6px 18px rgb(0 0 0 / .35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0d1110; --surface:#161c1a; --surface-2:#202825; --ink:#e9eeeb; --ink-2:#a9b4af; --ink-3:#86928c;
  --line:#29332f; --line-2:#3a4641; --go:#11874f; --go-hover:#16a15f; --go-soft:#15352a;
  --stop:#f2958d; --stop-soft:#3a1c1a; --warn:#e5ad52;
  --land:#1a221f; --sea:#0f1618; --coast:#2c3833; --road-casing:#0d1110;
  --shadow:0 1px 2px rgb(0 0 0 / .4), 0 6px 18px rgb(0 0 0 / .35);
}
*{box-sizing:border-box}
html,body{background:var(--paper)}
body{color:var(--ink);font:16px/1.5 var(--font);-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.15}
p{margin:0}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px;box-shadow:0 0 0 5px var(--ink)}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}
.ic{flex:none;display:block}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* ---------- interface chrome (not part of product) ---------- */
.proto{display:none!important}
.proto b{color:#fff;letter-spacing:.02em}
.proto .grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.proto label{color:#9fb0a8}
.proto select,.proto button{background:#222b28;border:1px solid #37433e;color:#fff;border-radius:8px;padding:5px 9px;font-size:13px;min-height:32px;cursor:pointer}
.proto button[aria-pressed="true"]{background:var(--signal);color:#131917;border-color:var(--signal);font-weight:700}
#frame{background:var(--paper)}
#frame.phone{max-width:390px;height:min(844px,calc(100dvh - 110px));margin:16px auto;overflow:hidden;border:10px solid #131917;border-radius:34px;transform:translateZ(0);box-shadow:0 20px 50px rgb(0 0 0 / .25)}
#app{container:app / inline-size;min-height:100%}
#frame.phone #app{height:100%;overflow:auto;background:var(--paper)}
#results{scroll-margin-top:calc(var(--hdr) + 8px)}

/* ---------- layout ---------- */
.wrap{padding-inline:16px;max-width:1280px;margin-inline:auto;width:100%}
.stack{display:flex;flex-direction:column}

/* ---------- header ---------- */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.hdr > .wrap{height:var(--hdr);display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;font-family:var(--display);font-weight:900;font-size:21px;letter-spacing:-.01em;margin-right:auto}
.brand .uk{font-size:11px;font-weight:800;letter-spacing:.08em;background:var(--ink);color:var(--paper);border-radius:5px;padding:2px 5px 1px;transform:translateY(-1px)}
.nav{display:none;gap:4px}
.nav a{text-decoration:none;font-weight:700;font-size:15px;padding:10px 12px;border-radius:10px;min-height:44px;display:flex;align-items:center;gap:6px;color:var(--ink-2)}
.nav a:hover,.nav a[aria-current="page"]{background:var(--surface-2);color:var(--ink)}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.icon-btn:hover{background:var(--surface-2)}
.menu{border-top:1px solid var(--line);background:var(--surface)}
.menu .wrap{height:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-block:12px}
.menu a{display:flex;align-items:center;gap:10px;min-height:52px;padding:0 14px;border:1px solid var(--line);border-radius:12px;text-decoration:none;font-weight:700}
@container app (min-width:760px){.nav{display:flex}.hdr .menu-btn{display:none}.menu{display:none}}

/* ---------- road chips (signage-derived) ---------- */
.road{display:inline-flex;align-items:center;font-family:var(--display);font-weight:800;font-size:15px;line-height:1;padding:5px 7px 3px;border-radius:5px;letter-spacing:.01em;white-space:nowrap;text-decoration:none}
.road.m{background:var(--mway);color:#fff}
.road.a{background:var(--aroad);color:var(--aroad-num)}
.road.lg{font-size:30px;padding:9px 13px 5px;border-radius:8px;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line-2)}
.dir{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:14px;padding:3px 9px 3px 6px;border-radius:999px;background:var(--surface-2);white-space:nowrap}
.dir.one{background:var(--ink);color:var(--paper)}
.type{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.status{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:14px}
.status::before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor}
.status.open{color:var(--go)}
.status.closed{color:var(--stop)}
.status.unknown{color:var(--ink-3)}
:root[data-theme="dark"] .status.open{color:#4fcf8c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .status.open{color:#4fcf8c}}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;font-weight:800;font-size:16px;text-decoration:none;border:1.5px solid var(--line-2);background:var(--surface);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.go{background:var(--go);border-color:var(--go);color:var(--go-ink)}
.btn.go:hover{background:var(--go-hover)}
.btn.xl{min-height:58px;font-size:18px;border-radius:14px;padding:0 22px}
.btn.sm{min-height:44px;font-size:15px;padding:0 14px}
.btn.block{width:100%}
.link{font-weight:700;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1.5px;background:none;border:0;padding:0;cursor:pointer;color:inherit}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 13px;border-radius:999px;border:1.5px solid var(--line-2);background:var(--surface);font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap;text-decoration:none}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chip .count{background:var(--signal);color:#131917;border-radius:999px;font-size:12px;padding:0 6px;min-width:20px;text-align:center}
.seg{display:inline-flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg button{min-height:40px;min-width:76px;border:0;border-radius:9px;background:transparent;font-weight:800;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;padding:0 12px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* ---------- hero + search ---------- */
.hero{padding-block:22px 18px;background:var(--surface);border-bottom:1px solid var(--line)}
.hero h1{font-family:var(--display);font-weight:900;font-size:clamp(30px,8cqi,46px);letter-spacing:-.02em;line-height:1.02}
.hero p.sub{color:var(--ink-2);margin-top:8px;font-size:17px;max-width:60ch}
.hero .actions{display:grid;gap:10px;margin-top:18px;max-width:860px}
.search{position:relative}
.search .field{display:flex;align-items:center;gap:8px;height:56px;border:2px solid var(--line-2);border-radius:14px;background:var(--surface);padding:0 6px 0 14px}
.search .field:focus-within{border-color:var(--ink);box-shadow:0 0 0 3px var(--signal)}
.search input{flex:1;min-width:0;border:0;background:transparent;font-size:17px;height:100%;outline:none}
.search input::placeholder{color:var(--ink-3)}
.search .go-search{height:44px;padding:0 14px;border-radius:10px;border:0;background:var(--ink);color:var(--paper);font-weight:800;cursor:pointer}
.examples{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px;color:var(--ink-3);margin-top:2px}
.examples button{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:5px 9px;font-weight:700;font-size:14px;cursor:pointer;min-height:34px;color:var(--ink)}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line-2);border-radius:14px;box-shadow:var(--shadow);z-index:40;overflow:hidden;max-height:min(420px,60vh);overflow-y:auto}
.sugg h4{margin:0;padding:10px 14px 4px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.sugg a{display:flex;align-items:center;gap:10px;min-height:48px;padding:6px 14px;text-decoration:none}
.sugg a:hover,.sugg a[aria-selected="true"]{background:var(--surface-2)}
.sugg small{color:var(--ink-3);margin-left:auto;font-size:13px;white-space:nowrap}
.sugg .none{padding:14px;color:var(--ink-2);font-size:15px}
.or{display:flex;align-items:center;gap:10px;color:var(--ink-3);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
@container app (min-width:760px){
  .hero{padding-block:34px 28px}
  .hero .actions{grid-template-columns:auto 1fr;align-items:start}
  .hero .or{display:none}
  .hero .examples{grid-column:2}
}

/* ---------- V2 mobile-first refinements ---------- */
@container app (max-width:599px){
  .hero{padding-block:18px 14px}
  .hero h1{font-size:clamp(30px,9cqi,38px)}
  .hero p.sub{font-size:16px;margin-top:6px}
  .hero .actions{margin-top:14px;gap:8px}
  .hero .btn.xl{min-height:54px}
  .search .field{height:54px;min-width:0;padding-left:12px;padding-right:4px}
  .search input{font-size:16px}
  .search .go-search{width:48px;min-width:48px;padding:0;font-size:0;flex:none}
  .search .go-search::after{content:"Go";font-size:14px}
  .examples{display:none;margin-top:0}
  .search:focus-within ~ .examples{display:flex}
  .notice.demo{display:none}
  .results{padding-top:10px}
  .quick{min-width:0;flex-wrap:nowrap;overflow-x:auto;overscroll-behavior-inline:contain;scrollbar-width:none;padding-bottom:2px}
  .quick::-webkit-scrollbar{display:none}
  .results .toggle-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center}
  .seg button{min-width:62px;padding-inline:10px}
}

/* ---------- results + split ---------- */
.results{padding-block:14px 28px}
.rbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.rbar .where{font-size:15px;color:var(--ink-2)}
.rbar .where strong{color:var(--ink)}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.split{display:grid;gap:14px}
.list{display:grid;gap:10px;align-content:start}
.mapwrap{position:relative;height:210px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--sea)}
.results[data-view="map"] .list{display:none}
.results[data-view="map"] .mapwrap{height:min(64vh,560px)}
.map-card{position:absolute;left:10px;right:10px;bottom:10px;z-index:3}
.results[data-view="list"] .map-card{display:none}
.toggle-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
@container app (min-width:960px){
  .split{grid-template-columns:minmax(380px,460px) 1fr;gap:20px;align-items:start}
  .mapwrap,.results[data-view="map"] .mapwrap{position:sticky;top:calc(var(--hdr) + 16px);height:calc(100vh - var(--hdr) - 32px);min-height:460px;order:2}
  .results[data-view="map"] .list{display:grid}
  .map-card,.toggle-row .seg{display:none}
}

/* ---------- map ---------- */
.map{position:absolute;inset:0;touch-action:none;cursor:grab}
.map:active{cursor:grabbing}
.map svg{width:100%;height:100%;display:block}
.map .landp{fill:var(--land);stroke:var(--coast);stroke-width:1.2;vector-effect:non-scaling-stroke}
.map .rd{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.map .rd.case{stroke:var(--road-casing);stroke-width:6}
.map .rd.m{stroke:var(--mway);stroke-width:3.2}
.map .rd.a{stroke:var(--aroad);stroke-width:2.6}
.map .rd.dim{opacity:.35}
.map .pin{cursor:pointer}

.map .pin text{font-family:var(--display);font-weight:900;pointer-events:none}
.map .town{font-size:12px;fill:var(--ink-3);font-weight:700}
.map-ctrl{position:absolute;right:10px;top:10px;display:grid;gap:6px;z-index:2}
.map-ctrl button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);font-size:22px;font-weight:800;cursor:pointer;display:grid;place-items:center;box-shadow:var(--shadow)}
.map-attr{position:absolute;left:8px;top:8px;font-size:11px;color:var(--ink-3);background:color-mix(in srgb,var(--surface) 85%,transparent);padding:2px 7px;border-radius:6px;z-index:2}
.map-legend{position:absolute;left:8px;bottom:8px;display:flex;gap:10px;font-size:12px;font-weight:700;background:var(--surface);padding:5px 9px;border-radius:8px;z-index:2;border:1px solid var(--line)}
.results[data-view="map"] .map-legend{display:none}
@container app (max-width:959px){
  .results[data-view="list"] .mapwrap{display:none}
  .results[data-view="map"] .list{display:none}
  .results[data-view="map"] .mapwrap{display:block;height:min(68vh,600px)}
}
@container app (min-width:960px){.results[data-view="map"] .map-legend{display:flex}}
.map-legend span{display:inline-flex;align-items:center;gap:5px}
.lg-dot{width:16px;height:16px;border-radius:50%;display:inline-grid;place-items:center;font-family:var(--display);font-weight:900;font-size:10px;background:var(--ink);color:var(--paper)}
.lg-dot.o{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}

/* ---------- location card ---------- */
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px;transition:box-shadow .15s}
.card:hover{border-color:var(--line-2)}
.card.sel{border-color:var(--ink);box-shadow:0 0 0 3px var(--signal)}
.card .top{display:flex;gap:12px;align-items:flex-start}
.card h3{font-size:19px;font-weight:800;line-height:1.2}
.card h3 a{text-decoration:none}
.card h3 a::after{content:"";position:absolute;inset:0;border-radius:var(--r)}
.card .meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-top:6px}
.card .dist{margin-left:auto;text-align:right;flex:none;line-height:1}
.dist b{font-family:var(--display);font-weight:900;font-size:28px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.dist span{font-weight:800;font-size:14px;margin-left:2px;color:var(--ink-2)}
.dist small{display:block;font-size:12px;color:var(--ink-3);margin-top:3px;font-weight:700}
.card .row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.card .note{font-size:14px;color:var(--ink-2)}
.facs{display:flex;flex-wrap:wrap;gap:6px}
.fac{width:36px;height:36px;border-radius:9px;background:var(--surface-2);display:grid;place-items:center}
.fac.more{width:auto;padding:0 9px;font-weight:800;font-size:14px;color:var(--ink-2)}
.facs.none{font-size:14px;color:var(--ink-3)}
.card .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;position:relative;z-index:1}
.card.compact{box-shadow:var(--shadow);gap:8px;padding:12px}
.card.compact .btns{grid-template-columns:1fr 1fr}
.card .junc{font-family:var(--display);font-weight:800;font-size:13px;color:var(--ink-2)}

/* ---------- road strip ---------- */
.strip{display:grid;gap:0}
.strip .stop{display:grid;grid-template-columns:62px 1fr;gap:10px;position:relative;padding-bottom:10px}
.strip .stop::before{content:"";position:absolute;left:30px;top:0;bottom:0;width:6px;background:var(--rc,var(--mway));border-radius:3px}
.strip .stop:first-child::before{top:18px}
.strip .stop:last-child::before{bottom:auto;height:30px}
.strip .node{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;padding-top:14px;gap:4px}
.strip .node i{width:20px;height:20px;border-radius:50%;background:var(--surface);border:4px solid var(--rc,var(--mway))}
.strip .node span{font-family:var(--display);font-weight:800;font-size:12px;background:var(--paper);padding:1px 3px;border-radius:4px;text-align:center;line-height:1.2}
.strip .end{display:grid;grid-template-columns:62px 1fr;gap:10px;align-items:center;font-weight:800;color:var(--ink-2);font-size:14px;padding-block:4px 10px}
.strip .end i{justify-self:center;width:26px;height:6px;border-radius:3px;background:var(--rc,var(--mway))}

/* ---------- page headers ---------- */

function miles(a,b,c,d){const R=3958.8,r=Math.PI/180,x=Math.sin((c-a)*r/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin((d-b)*r/2)**2;return 2*R*Math.asin(Math.sqrt(x));}

function ukNow(){ try{return new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date());}catch(e){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');} }
function openStatus(h){
  if(h==='24/7') return {state:'open',text:'Open 24 hours',long:'Every day, 24 hours'};
  const m = h && h.match(/^(\d\d:\d\d)-(\d\d:\d\d)$/);
  if(m){ const n=ukNow(); const open = n>=m[1] && n<m[2];
    return open ? {state:'open',text:`Open until ${m[2]}`,long:`Every day, ${m[1]}–${m[2]}`} : {state:'closed',text:`Closed · opens ${m[1]}`,long:`Every day, ${m[1]}–${m[2]}`}; }
  return {state:'unknown',text:'Hours not confirmed',long:null};
}
function facList(l){ return FACILITIES.filter(([k])=>yes(l[k])); }
function facIcons(l,max=7){
  const av = facList(l);
  if(!av.length) return `<div class="facs none">No facilities confirmed yet</div>`;
  const shown = av.slice(0,max), more = av.length-shown.length;
  return `<ul class="facs" role="list" aria-label="Facilities" style="list-style:none;margin:0;padding:0">${shown.map(([k,lab,i])=>`<li class="fac" title="${lab}">${ic(i,20)}<span class="sr">${lab}</span></li>`).join('')}${more>0?`<li class="fac more" title="${av.slice(max).map(f=>f[1]).join(', ')}">+${more}<span class="sr"> more: ${av.slice(max).map(f=>f[1]).join(', ')}</span></li>`:''}</ul>`;
}
function matchFilters(l){
  const f=S.filters;

  if(f.types.size && !f.types.has(TYPES[l.location_type].group)) return false;

  // Strict AND semantics: every selected facility must be explicitly confirmed.
  // Production data can contain tri-state strings or booleans, so normalize both.
  for(const k of f.facs){
    const tri = l._facilities ? l._facilities[k] : undefined;
    if(tri !== undefined){
      if(!yes(tri)) return false;
    }else{
      if(!yes(l[k])) return false;
    }
  }
  return true;
}
function nearby(p,r){ return LOCATIONS.map(l=>({l,d:distFrom(l,p)})).filter(x=>x.d<=r && matchFilters(x.l)).sort((a,b)=>a.d-b.d); }

    this.el.addEventListener('pointerdown',e=>{st={x:e.clientX,y:e.clientY,cx:this.vb.cx,cy:this.vb.cy,moved:false,pin:e.target.closest('[data-pin]')};this.el.setPointerCapture(e.pointerId);});

    this.el.addEventListener('pointerup',()=>{if(st&&!st.moved&&this.onSelect){this.onSelect(st.pin?st.pin.dataset.pin:null);}st=null;});
    new ResizeObserver(()=>this.apply()).observe(this.el);
    this.fit();
  }
  fit(){
    const pts=this.items.map(l=>P(l.lat,l.lon)); if(this.user && (!this.single || distFrom(this.items[0],this.user)<60)) pts.push(P(this.user.lat,this.user.lon));
    if(!pts.length && this.road) ROADS[this.road].path.forEach(p=>pts.push(P(p[0],p[1])));
    if(!pts.length) pts.push(P(52.9,-1.2));
    const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]),W=this.el.clientWidth||320,H=this.el.clientHeight||220;
    const dx=Math.max(...xs)-Math.min(...xs),dy=Math.max(...ys)-Math.min(...ys);
    this.vb={cx:(Math.max(...xs)+Math.min(...xs))/2,cy:(Math.max(...ys)+Math.min(...ys))/2,w:Math.max(this.single?26:22,Math.max(dx,dy*W/H)*1.35)};
    this.apply();
  }
  apply(){
    const W=this.el.clientWidth||320,H=this.el.clientHeight||220,{cx,cy,w}=this.vb,h=w*H/W;
    this.upp=w/W; this.svg.setAttribute('viewBox',`${cx-w/2} ${cy-h/2} ${w} ${h}`); this.draw();
  }
  select(s){this.sel=s;this.draw();}
  highlight(s){this.hl=s;this.draw();}
  draw(){
    const u=this.upp,o=this.svg.querySelector('.ovl'); let out='';
    if(this.vb.w<420) for(const [,p] of Object.entries(PLACES)){const [x,y]=P(p[1],p[2]);out+=`<circle cx="${x}" cy="${y}" r="${2.5*u}" fill="currentColor" style="color:var(--ink-3)"/><text class="town" x="${x+6*u}" y="${y+4*u}" style="font-size:${12*u}px">${esc(p[0])}</text>`;}
    for(const [s,r] of Object.entries(ROADS)){ if(this.road && this.road!==s) continue; const m=r.path[Math.floor(r.path.length/2)],[x,y]=P(m[0],m[1]),bw=(r.label.length*8+10)*u,bh=18*u;
      out+=`<g><rect x="${x-bw/2}" y="${y-bh/2}" width="${bw}" height="${bh}" rx="${3*u}" fill="${r.kind==='m'?'#1b4f9c':'#0a6b3d'}" stroke="#fff" stroke-width="1.5" vector-effect="non-scaling-stroke"/><text x="${x}" y="${y+4.6*u}" text-anchor="middle" style="font-size:${12.5*u}px;font-family:Overpass,sans-serif;font-weight:900" fill="${r.kind==='m'?'#fff':'#ffd21f'}">${r.label}</text></g>`; }
    if(this.user){const [x,y]=P(this.user.lat,this.user.lon);out+=`<circle cx="${x}" cy="${y}" r="${20*u}" fill="#1b4f9c" opacity=".16"/><circle cx="${x}" cy="${y}" r="${8*u}" fill="#1b4f9c" stroke="#fff" stroke-width="3" vector-effect="non-scaling-stroke"/>`;}
    const order=[...this.items].sort((a,b)=>(a.slug===this.sel)-(b.slug===this.sel));
    for(const l of order){
      const [x,y]=P(l.lat,l.lon),t=TYPES[l.location_type],on=l.slug===this.sel||l.slug===this.hl,r=(on?17:13.5)*u,hollow=t.pin==='P';
      const fill=on?'#ffd21f':hollow?'var(--surface)':'var(--ink)',txt=on?'#131917':hollow?'var(--ink)':'var(--paper)';
      out+=`<g class="pin" data-pin="${l.slug}"><circle class="b" cx="${x}" cy="${y}" r="${r+3*u}" fill="${on?'#131917':'transparent'}" stroke="none"/><circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" stroke="${hollow&&!on?'var(--ink)':'var(--surface)'}" stroke-width="${hollow&&!on?2.5:2}" vector-effect="non-scaling-stroke"/><text x="${x}" y="${y+(on?5.6:4.6)*u}" text-anchor="middle" fill="${txt}" style="font-size:${(on?16:13)*u}px">${t.pin}</text></g>`;
    }
    o.innerHTML=out;
  }
}

function resultsBlock(){
  if(S.loading) return `<div class="rbar"><h2 id="res-h" class="where">Finding stops near you…</h2></div><div class="split"><div class="mapwrap"><div class="sk" style="position:absolute;inset:0;border-radius:0"></div></div><div class="list" aria-busy="true">${skeleton(3)}</div></div>`;

  const u=S.user;

  // Road-search mode: use the production road field directly and ignore radius.
  if(S.roadQuery){
    const target=String(S.roadQuery).toUpperCase().replace(/\s+/g,'');
    let roadItems=LOCATIONS.filter(l =>
      String(l.road||'').toUpperCase().replace(/\s+/g,'')===target
    ).filter(matchFilters);

    roadItems.sort((a,b)=>{
      const da=distFrom(a,u), db=distFrom(b,u);
      return da-db;
    });

    const allCount=roadItems.length;
    const items=roadItems.slice(0,50);
    S.count=()=>allCount;

    const activeFacs=[...S.filters.facs].map(k=>({
      toilets:'Toilets',fuel:'Fuel',hgv_parking:'HGV',ev_charging:'EV charging',
      food:'Food',coffee:'Coffee',shop:'Shop',showers:'Showers',hotel:'Hotel'
    }[k]||k));
    const filterText=activeFacs.length ? ` · must have ${activeFacs.join(' + ')}` : '';

    if(!items.length){
      return `<div class="rbar"><h2 id="res-h" class="where"><strong>0 stops</strong> on <strong>${esc(S.roadQuery)}</strong>${filterText}</h2></div>
        <div class="toggle-row" style="margin-bottom:12px;flex-wrap:wrap">${quickChips()}${viewToggle()}</div>`+
        stateBox({
          icon:'pin',
          title:`No stops found on ${esc(S.roadQuery)} with these filters.`,
          body:'Clear one or more filters to see more results.',
          actions:'<button class="btn" data-action="clear">Clear filters</button>'
        });

      </div>
      ${splitBlock(items,{mapOpts:{user:null}})}`;
  }

  const allRes=nearby(u,S.radius), res=allRes.slice(0,20), items=res.map(x=>x.l);
  const note = u.kind==='example' ? `<div class="notice demo">${ic('info',20)}<span>Showing an example location. Tap <b>Use my location</b> to see stops near you.</span></div>`
    : u.kind==='demo-gps' ? `<div class="notice demo">${ic('info',20)}<span>Location isn't available in this preview, so we've used Boston, PE21 as a stand-in.</span></div>` : '';
  const where = u.kind==='gps' ? 'your location' : esc(u.label);
  S.count=()=>nearby(u,S.radius).length;
  if(!items.length){ const next=STEPS.find(s=>s>S.radius);
    return `${note}<div class="toggle-row" style="margin-bottom:12px">${quickChips()}</div>`+stateBox({icon:'pin',title:`No rest areas found within ${S.radius} miles.`,body:filterCount()?'Your filters may be hiding some stops.':`Nothing listed near ${where} yet.`,
      actions:`<div style="display:flex;gap:8px;flex-wrap:wrap">${next?`<button class="btn go" data-action="radius" data-r="${next}">Search within ${next} miles</button>`:''}${filterCount()?'<button class="btn" data-action="clear">Clear filters</button>':''}</div>`}); }
  const activeFacs=[...S.filters.facs].map(k=>({
    toilets:'Toilets',fuel:'Fuel',hgv_parking:'HGV',ev_charging:'EV charging',
    food:'Food',coffee:'Coffee',shop:'Shop',showers:'Showers',hotel:'Hotel'
  }[k]||k));
  const filterText=activeFacs.length ? ` · must have ${activeFacs.join(' + ')}` : '';
  return `${note}<div class="rbar"><h2 id="res-h" class="where"><strong>${allRes.length} stops</strong> within ${S.radius} miles of <strong>${where}</strong>${filterText}</h2></div>
    <div class="toggle-row" style="margin-bottom:12px;flex-wrap:wrap">${quickChips()}${viewToggle()}</div>

    intro:`Services, lay-bys and truck stops within 30 miles of ${p[0]} town centre.`,items,center:c,centerLabel:`${p[0]} centre`});

function typePage(s){
  const t=TYPE_PAGES.find(x=>x[0]===s); if(!t) return notFound();
  const intros={'motorway-services':'Full service areas on motorways: toilets, food and fuel, usually open 24 hours.','truck-stops':'Stops built for HGV drivers, often with showers, overnight parking and hot food.','hgv-parking':'Places where HGV parking is confirmed, including services and dedicated lorry parks.','lay-bys':'Quick places to pull over. Most have no facilities, so check before you rely on one.'};
  return listingPage({crumb:[`<span aria-current="page">${t[1]}</span>`],title:t[1],intro:intros[s],items:LOCATIONS.filter(TYPE_FILTER[s])});
}
function yn(v){ return v===true||v==='yes'?'<span class="yes">Yes</span>':v===false||v==='no'?'<span class="no">No</span>':'<span class="unk">Unknown</span>'; }
function overnight(v){ return v==='paid'?'<span class="yes">Available</span> · fee':v===true||v==='yes'?'<span class="yes">Available</span>':v===false||v==='no'?'<span class="no">Not available</span>':'<span class="unk">Unknown</span>'; }
function nextStops(l){
  const out=[];
  for(const s of l.roads){ const r=ROADS[s]; const dirs=r.axis==='ns'?['northbound','southbound']:['eastbound','westbound'];
    for(const d of dirs){ if(l.direction!=='both'&&l.direction!==d) continue;
      const key=r.axis==='ns'?x=>x.lat:x=>x.lon, sign=(d==='northbound'||d==='eastbound')?1:-1;
      const ahead=LOCATIONS.filter(x=>x!==l&&x.roads.includes(s)&&(x.direction==='both'||x.direction===d)&&(key(x)-key(l))*sign>0).sort((a,b)=>(key(a)-key(b))*sign).slice(0,2);
      if(ahead.length) out.push({s,d,ahead}); } }
  return out;
}

  ${sec(10,'region','Region pages',`<ul><li>H1 “Rest Areas in Lincolnshire”, one useful paragraph written for the area (not boilerplate).</li><li>Road filter chips built from the roads present. Towns in the region link to town pages.</li><li>Counties nest under regions in the breadcrumb (Lincolnshire › East Midlands) so the same structure extends to Scotland, Wales and beyond.</li></ul><p><a class="btn" href="#region-lincolnshire">Open Lincolnshire</a> <a class="btn" href="#town-boston">Open Boston</a></p>`)}

  ${sec('11–12','detail','Location page · desktop and mobile',`
    <ul><li>Above the fold: type, name, road + direction, then a three-cell key facts row (distance, open status, operator) and the <b>Get directions</b> button.</li><li>Sections in decision order: Facilities → Parking → Opening hours → Next stops on this road → Location information → Map.</li><li>“Next stops on this road” answers the question drivers ask when a stop doesn't suit: what's after this one, in my direction?</li><li>Mobile: the sticky bottom bar appears only after the main Get directions button has scrolled out of view, avoiding duplicate CTAs. Desktop: map and verification note in a sticky side column.</li><li>Last checked date and source are always shown. “Suggest a correction” is the only contribution path in the MVP.</li></ul><p><a class="btn" href="#loc-grantham-north-services-a1">Open Grantham North</a> <a class="btn" href="#loc-a16-lay-by-kirton">Open a lay-by with sparse data</a></p>`)}

  ${sec(13,'nav','Navigation and header',`<ul><li>60px sticky header: logo, Near me, Motorways, A roads, Regions, search icon. No mega menu.</li><li>Under 760px the four links move into a two-by-two menu sheet; logo and search stay visible.</li><li>Brand is a single token swap: name, wordmark and logo mark live in one config file.</li></ul>`)}

  ${sec(14,'icons','Facility icon system',`<p>24px grid, 1.8px stroke, round caps. Icons are information, so each one maps to one database field and always travels with an accessible label. “WC” and “P” are used as-is because they're what UK signs use.</p>
    <div class="iconsheet">${FACILITIES.map(([k,t,i])=>`<div>${ic(i,30)}${t}<code>${k}</code></div>`).join('')}${[['car','Car parking','car_parking'],['parking','Parking','—'],['clock','24-hour','opening_hours']].map(([i,t,k])=>`<div>${ic(i,30)}${t}<code>${k}</code></div>`).join('')}</div>`)}

  ${sec(15,'filters','Filters',`<ul><li>Four quick chips in the results bar (Toilets, Fuel, HGV, EV). Everything else sits in one sheet: Type of stop (3 groups), Must have (8 facilities), Distance (10 / 25 / 50 / 100 mi). Direction lives on road pages only.</li><li>Filters are “must have confirmed”. Unknown values never pass a filter.</li><li>The sheet's button shows the live count: “Show 6 stops”.</li></ul><p><button class="btn" data-action="sheet">Open the filter sheet</button></p>`)}

  ${sec(16,'states','Empty, error and loading states',`<div class="g2">
    ${stateBox({icon:'alert',warn:true,title:"We couldn't access your location.",body:'Enter a postcode or town instead.',actions:`<button class="btn go" data-action="search-focus">${ic('search',20)}Search by postcode or town</button>`})}
    ${stateBox({icon:'pin',title:'No rest areas found within 10 miles.',body:'Nothing listed near Cromer yet.',actions:'<button class="btn go" data-action="noop">Search within 25 miles</button>'})}
    <div class="stack" style="gap:10px">${skeleton(1)}</div>
    ${stateBox({icon:'alert',title:"We couldn't find that page.",body:'It may have moved. Search for a road, town or postcode instead.',actions:'<a class="btn go" href="#home">Go to search</a>'})}</div>
    <p>Use the <b>Demo state</b> menu in the top bar to see each state in context.</p>`)}

  ${sec(17,'footer','Footer',`<p>Dark ink band: links to top roads, regions and stop types (internal linking for SEO), then attribution (© OpenStreetMap contributors), the “always follow road signs” caveat, About, Suggest a correction, Privacy.</p>`)}

  ${sec(18,'components','Reusable component system',`<div class="tbl"><table><thead><tr><th>Component</th><th>Props</th><th>Notes</th></tr></thead><tbody>${comps.map(c=>`<tr><td><b>${c[0]}</b></td><td><code>${c[1]}</code></td><td>${c[2]}</td></tr>`).join('')}</tbody></table></div>`)}

  ${sec('A','data','Incomplete data rules',`<div class="tbl"><table><thead><tr><th>Field value</th><th>Card</th><th>Detail page</th><th>Filters</th></tr></thead><tbody>
    <tr><td><code>true</code></td><td>Icon shown</td><td>In facility grid</td><td>Passes</td></tr>
    <tr><td><code>false</code></td><td>Hidden</td><td>Listed under “Not available”</td><td>Fails</td></tr>
    <tr><td><code>null</code> (unknown)</td><td>Hidden</td><td>Collapsed “not yet confirmed” list. Parking fields show “Unknown”</td><td>Fails</td></tr>
    <tr><td>No facilities at all</td><td>“No facilities confirmed yet”</td><td>Plain sentence</td><td>—</td></tr>
    <tr><td><code>opening_hours</code> null</td><td>“Hours not confirmed” in grey</td><td>Sentence advising a check</td><td>—</td></tr>
    <tr><td><code>direction</code> null</td><td>“Direction not confirmed”</td><td>Same</td><td>Excluded from one-direction filters</td></tr></tbody></table></div>
    <p>We never infer. A motorway service area without a confirmed showers value does not show showers, even though most have them.</p>`)}

  ${sec('B','seo','SEO and rendering',`<ul><li><b>Interface routing note:</b> this single-file demo uses hash routes so it can run locally. Production must use real indexable paths such as <code>/rest-areas/m1/</code>, <code>/rest-areas/lincolnshire/</code>, <code>/rest-areas/boston/</code> and <code>/locations/grantham-north-services-a1/</code>.</li><li>Next.js App Router with static generation for every road, region, town, type and location page (<code>generateStaticParams</code>) and ISR revalidation daily. Content is in the HTML; the map and geolocation are client-side enhancements.</li><li>Location pages emit schema.org JSON-LD (<code>Place</code>, <code>GasStation</code> or <code>ParkingFacility</code> by type) with <code>geo</code>, <code>address</code>, <code>openingHours</code>, <code>amenityFeature</code>, plus <code>BreadcrumbList</code>. Road and region pages emit <code>ItemList</code>.</li><li>Unique title and description templates, e.g. “M1 Services &amp; Rest Areas — Northbound and Southbound | RestStop UK”. Canonical URLs, trailing slash, XML sitemap split by template.</li><li>Direction, near-me and filters are URL parameters, <code>noindex</code> for filtered variants, canonical to the base page.</li><li>Thin pages (towns with fewer than 3 stops) are not generated.</li></ul>`)}

  ${sec('C','perf','Performance budget',`<div class="tbl"><table><thead><tr><th>Metric</th><th>Budget</th><th>How</th></tr></thead><tbody>
    <tr><td>JS on location page before map</td><td>&lt; 60 KB gz</td><td>Server components; only search, filters and map are client islands</td></tr>
    <tr><td>Map library</td><td>Lazy, after first paint</td><td>MapLibre loaded on idle or on first interaction with the map area; static placeholder until then</td></tr>
    <tr><td>LCP (4G, mid-range Android)</td><td>&lt; 1.8 s</td><td>Static HTML from CDN, system-font fallback with <code>font-display: swap</code>, no hero images</td></tr>
    <tr><td>CLS</td><td>&lt; 0.05</td><td>Fixed map heights, reserved card sizes, skeletons match real cards</td></tr>
    <tr><td>Third-party scripts</td><td>0 at MVP</td><td>Privacy-friendly server-side analytics only</td></tr></tbody></table></div>`)}

  ${sec('D','stack','Stack and data',`<ul><li>Next.js + TypeScript + Tailwind CSS. Design tokens above become Tailwind theme values.</li><li>Maps: MapLibre GL with OpenStreetMap vector tiles (OpenFreeMap or a self-hosted Protomaps PMTiles file for predictable cost).</li><li>Data: nightly Overpass import (<code>highway=services</code>, <code>highway=rest_area</code>, <code>amenity=parking</code> + <code>hgv=yes</code>, lay-bys) into PostgreSQL/Supabase with PostGIS. Manual verification sets <code>last_verified</code>. Nearby queries use <code>ST_DWithin</code>, or a precomputed static JSON per region at MVP scale.</li><li>Directions: universal Google Maps URL. No custom routing.</li></ul>`)}

  ${sec('E','scope','MVP scope and expansion',`<div class="g2"><div><h3>In the MVP</h3><ul><li>Home, Use my location, search, map, nearby results</li><li>Road, region, town, type and location pages</li><li>Facilities, parking, hours, directions link</li><li>Suggest a correction (simple form)</li></ul></div><div><h3>Not now</h3><ul><li>Accounts, login, reviews, ratings, comments</li><li>Payments, bookings, memberships</li><li>Social profiles, messaging, loyalty</li><li>Native app</li></ul></div></div>
    <p><b>Expansion:</b> <code>country</code> field on every record; region tree becomes country › region › county › town. Scotland, Wales and Northern Ireland slot into the existing <code>/rest-areas/{region}/</code> pattern. Ireland and Europe get a locale prefix (<code>/ie/</code>, <code>/fr/</code>), km as the default unit, and road plate styles per country (Irish N roads, French A/N). The UI itself doesn't change.</p>`)}
  </div>`;
}
/* ================= ROUTER + RENDER ================= */
let MAPS=[];
const route = () => (location.hash||'#home').slice(1) || 'home';
function render(keep){
  const sc=scroller(), y = keep ? (sc===window?window.scrollY:sc.scrollTop) : 0;
  const r=S.route=route(); S.maps=[]; S.count=null;
  let main;
  if(r==='home') main=home();
  else if(r==='system') main=docPage();
  else if(r.startsWith('road-')) main=roadPage(r.slice(5));
  else if(r.startsWith('region-')) main=regionPage(r.slice(7));
  else if(r.startsWith('town-')) main=townPage(r.slice(5));
  else if(r.startsWith('type-')) main=typePage(r.slice(5));
  else if(r.startsWith('loc-')) main=locPage(r.slice(4));
  else if(['motorways','a-roads','regions'].includes(r)) main=indexPage(r);
  else main=notFound();
  app.innerHTML = header()+`<main id="main">${main}</main>`+footer();
  mountMaps(); setupStickyDirections(); renderSheet(); syncProto();
  sc.scrollTo(0,y);
  if(S.scrollResults){ S.scrollResults=false; const el=app.querySelector('#results'); if(el) el.scrollIntoView({block:'start'}); }
  if(S.focusSearch){ S.focusSearch=false; const i=app.querySelector('.search input'); if(i){ i.focus({preventScroll:true}); i.scrollIntoView({block:'center'}); } }
}
function mountMaps(){
  MAPS = [...app.querySelectorAll('[data-map]')].map(el=>{ const cfg=S.maps.find(m=>m.id===el.dataset.map); return new MapView(el,{...cfg,onSelect:selectPin}); });
}
function setupStickyDirections(){
  const primary=app.querySelector('[data-primary-directions]');
  const sticky=app.querySelector('[data-sticky-directions]');
  if(!primary||!sticky) return;
  const update=()=>{
    const r=primary.getBoundingClientRect();
    const visible=r.bottom>0 && r.top<(window.innerHeight||document.documentElement.clientHeight);
    sticky.hidden=visible;
  };
  update();
  if('IntersectionObserver' in window){
    const io=new IntersectionObserver(entries=>{ sticky.hidden=entries[0]?.isIntersecting??true; },{threshold:.05});
    io.observe(primary);
    sticky._io=io;
  } else {
    const sc=scroller();
    sc.addEventListener('scroll',update,{passive:true});
  }
}
function selectPin(slug){
  if(S.route.startsWith('loc-')) return;
  S.selected=slug; MAPS.forEach(m=>m.select(slug));
  app.querySelectorAll('.list .card').forEach(c=>c.classList.toggle('sel',c.dataset.slug===slug));
  app.querySelectorAll('.map-card').forEach(mc=>mc.innerHTML = slug&&BY_SLUG[slug] ? cardHTML(BY_SLUG[slug],{compact:true}) : '');
  if(slug && app.clientWidth>=960){ const c=app.querySelector(`.list .card[data-slug="${slug}"]`); if(c) c.scrollIntoView({block:'nearest',behavior:'smooth'}); }
}
function goHome(){ if(route()!=='home') location.hash='home'; else render(true); }
const toggle=(set,k)=>set.has(k)?set.delete(k):set.add(k);
const rerender=()=>render(true);

/* ================= LOCATION ================= */
function locate(){
  S.roadQuery=null;
  S.denied=false; S.loading=true; S.selected=null; S.scrollResults=true; goHome();
  const done=u=>{ S.loading=false; S.user=u; S.scrollResults=true; render(true); };
  if(S.demo==='denied'){ setTimeout(()=>{ S.loading=false; S.denied=true; render(true); },700); return; }
  const fallback=()=>setTimeout(()=>done({...EXAMPLE,kind:'demo-gps'}),500);
  try{ navigator.geolocation.getCurrentPosition(p=>done({lat:p.coords.latitude,lon:p.coords.longitude,label:'your location',kind:'gps'}),fallback,{timeout:4000,maximumAge:60000}); }
  catch(e){ fallback(); }
}
function setPlace(key,label){
  const p=PLACES[key]; if(!p) return;
  S.user={lat:p[1],lon:p[2],label:label||p[0],kind:'search'}; S.denied=false; S.loading=false; S.selected=null; S.scrollResults=true; goHome();
}
function focusSearch(){ S.focusSearch=true; if(route()!=='home') location.hash='home'; else render(true); }

/* ================= SEARCH ================= */
function suggestions(q){
  const n=q.trim(); if(!n) return null;
  const U=n.toUpperCase().replace(/\s+/g,''), low=n.toLowerCase(), g={roads:[],places:[],stops:[]};
  for(const [s,r] of Object.entries(ROADS)){ if(r.label.startsWith(U) || U===r.label+'(M)') g.roads.push({href:`#road-${s}`,html:`<span class="road ${r.kind}">${r.label}</span>${r.from} – ${r.to}`,sub:`${LOCATIONS.filter(l=>l.roads.includes(s)).length} stops`}); }
  const pc=U.match(/^([A-Z]{1,2}\d[A-Z\d]?)(\d[A-Z]{2})?$/);
  if(pc && OUTWARD[pc[1]]) { const k=OUTWARD[pc[1]]; g.places.push({place:k,label:`${pc[1]}${pc[2]?' '+pc[2]:''}, ${PLACES[k][0]}`,html:`${ic('pin',20)}<b>${pc[1]}${pc[2]?' '+pc[2]:''}</b>&nbsp;${PLACES[k][0]}`,sub:'Postcode'}); }
  for(const [k,p] of Object.entries(PLACES)) if(p[0].toLowerCase().startsWith(low)) g.places.push({place:k,html:`${ic('pin',20)}${esc(p[0])}`,sub:REGIONS[p[3]].name});
  for(const l of LOCATIONS) if(l.name.toLowerCase().includes(low)) g.stops.push({href:`#loc-${l.slug}`,html:`${ic('fuel',20)}${esc(l.name)}`,sub:`${l.road}${S.user?` · ${fmt(distFrom(l))} mi`:''}`});
  return g;
}
function showSugg(form){
  const inp=form.querySelector('input'), box=form.querySelector('.sugg'), g=suggestions(inp.value);
  form._sel=-1;
  if(!g){ box.hidden=true; inp.setAttribute('aria-expanded','false'); return; }
  const grp=(t,a)=>a.length?`<h4>${t}</h4>${a.slice(0,4).map(x=>`<a role="option" href="${x.href||'#home'}"${x.place?` data-place="${x.place}" data-label="${esc(x.label||'')}"`:''}>${x.html}<small>${esc(x.sub)}</small></a>`).join('')}`:'';
  const html=grp('Roads',g.roads)+grp('Places',g.places)+grp('Stops',g.stops);
  box.innerHTML = html || `<p class="none">We couldn't find “${esc(inp.value.trim())}”. Try a postcode like PE21, a town, or a road like M1.</p>`;
  box.hidden=false; inp.setAttribute('aria-expanded','true');
}
function pickLink(a){ if(a.dataset.place){ setPlace(a.dataset.place,a.dataset.label||undefined); } else { location.hash=a.getAttribute('href').slice(1); } }

/* ================= EVENTS ================= */
app.addEventListener('input',e=>{ const f=e.target.closest('form[data-search]'); if(f) showSugg(f); });
app.addEventListener('keydown',e=>{
  const f=e.target.closest('form[data-search]'); if(!f) return;
  const opts=[...f.querySelectorAll('.sugg a')];
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){ if(!opts.length) return; e.preventDefault(); f._sel=((f._sel??-1)+(e.key==='ArrowDown'?1:-1)+opts.length)%opts.length; opts.forEach((o,i)=>o.setAttribute('aria-selected',i===f._sel)); opts[f._sel].scrollIntoView({block:'nearest'}); }
  if(e.key==='Escape'){ f.querySelector('.sugg').hidden=true; }
});
app.addEventListener('submit',e=>{
  const f=e.target.closest('form[data-search]'); if(!f) return; e.preventDefault();
  showSugg(f); const opts=[...f.querySelectorAll('.sugg a')]; const pick=opts[f._sel>=0?f._sel:0];
  if(pick){ pickLink(pick); }
});
app.addEventListener('focusout',e=>{ const f=e.target.closest('form[data-search]'); if(f && !f.contains(e.relatedTarget)) setTimeout(()=>{ const b=f.querySelector('.sugg'); if(b) b.hidden=true; },150); });
app.addEventListener('mouseover',e=>{ const c=e.target.closest('.list .card'); const s=c?c.dataset.slug:null; if(s!==app._hl){ app._hl=s; MAPS.forEach(m=>m.highlight(s)); } });
app.addEventListener('click',e=>{
  const sa=e.target.closest('.sugg a'); if(sa){ e.preventDefault(); pickLink(sa); return; }
  const q=e.target.closest('[data-q]'); if(q){ const inp=app.querySelector('.search input'); inp.value=q.dataset.q; showSugg(inp.form); inp.focus(); return; }
  const a=e.target.closest('[data-action]'); if(!a) return;
  switch(a.dataset.action){
    case 'locate': locate(); break;
    case 'search-focus': S.menu=false; focusSearch(); break;
    case 'menu': S.menu=!S.menu; rerender(); break;
    case 'view': S.view=a.dataset.v; rerender(); break;
    case 'fac': toggle(S.filters.facs,a.dataset.k); rerender(); break;
    case 'type': toggle(S.filters.types,a.dataset.k); rerender(); break;
    case 'radius': S.radius=+a.dataset.r; rerender(); break;
    case 'clear': S.filters.types.clear(); S.filters.facs.clear(); S.roadf='all'; rerender(); break;
    case 'clear-road': S.roadQuery=null; rerender(); break;
    case 'dir': S.dir=a.dataset.d; S.selected=null; rerender(); break;
    case 'roadf': S.roadf=a.dataset.r; S.selected=null; rerender(); break;
    case 'sheet': S.sheet=true; renderSheet(); app.querySelector('.sheet .icon-btn')?.focus(); break;
    case 'sheet-close': S.sheet=false; renderSheet(); break;
    case 'sheet-close-bg': if(e.target===a){ S.sheet=false; renderSheet(); } break;
    case 'copy': { const t=a.dataset.t, ok=()=>{a.innerHTML=ic('check',16)+'Copied';setTimeout(()=>a.innerHTML=ic('copy',16)+'Copy',1600);};
      try{ navigator.clipboard.writeText(t).then(ok,()=>{a.innerHTML=esc(t);}); }catch(err){ a.innerHTML=esc(t); } break; }
  }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&S.sheet){ S.sheet=false; renderSheet(); } });
window.addEventListener('hashchange',()=>{ S.selected=null; S.menu=false; S.dir='all'; S.roadf='all'; S.view='list'; S.sheet=false; render(false); if(scroller()===window && !S.scrollResults && !S.focusSearch) window.scrollTo(0,0); });

/* ================= INTERFACE CONTROLS ================= */
S.demo='normal';
function syncProto(){
  document.getElementById('pv-app').setAttribute('aria-pressed',S.route!=='system');
  document.getElementById('pv-sys').setAttribute('aria-pressed',S.route==='system');
  const pj=document.getElementById('pj'); pj.value=[...pj.options].some(o=>o.value===S.route)?S.route:'';
}
document.querySelectorAll('[data-pv]').forEach(b=>b.addEventListener('click',()=>{ location.hash=b.dataset.pv; }));
document.getElementById('pj').addEventListener('change',e=>{ if(e.target.value) location.hash=e.target.value; });
document.getElementById('pw').addEventListener('change',e=>{ frame.classList.toggle('phone',e.target.value==='phone'); render(false); });
document.getElementById('ps').addEventListener('change',e=>{
  const v=S.demo=e.target.value; S.loading=v==='loading'; S.denied=v==='denied'; S.selected=null;
  if(v==='none'){ S.user={lat:PLACES.cromer[1],lon:PLACES.cromer[2],label:'Cromer',kind:'search'}; S.radius=10; }
  else if(S.user.label==='Cromer'){ S.user={...EXAMPLE}; S.radius=25; }
  S.scrollResults=true; goHome();
});
render(false);
</script>


<script>
/* =========================
   RestStop UK Phase 8B data adapter
   Loads the real England dataset and exposes it as window.RESTSTOP_DATA.
   ========================= */
(function () {
  const DATA_URL = '/data/frontend/reststops-uk.min.json';

  function milesBetween(lat1, lon1, lat2, lon2) {
    const R = 3958.7613;
    const toRad = d => d * Math.PI / 180;
    const p1 = toRad(lat1), p2 = toRad(lat2);
    const dp = toRad(lat2 - lat1), dl = toRad(lon2 - lon1);
    const a = Math.sin(dp/2) ** 2 + Math.cos(p1) * Math.cos(p2) * Math.sin(dl/2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(a));
  }

  function normalizeStop(stop) {
    const type = stop.type || stop.location_type || '';
    const openingHours = stop.openingHours || stop.opening_hours || null;
    const nearestPlace = stop.nearestPlace || stop.nearest_place || null;
    const roadName = stop.roadName || stop.road_name || null;
    const outwardCode = stop.outwardCode || stop.outward_code || null;
    const officialName = stop.officialName || stop.official_name || null;
    const county = stop.county || stop.county_or_area || null;
    const district = stop.district || stop.local_authority || null;

    return {
      ...stop,
      type,
      openingHours,
      nearestPlace,
      roadName,
      outwardCode,
      officialName,
      county,
      district,
      lat: Number(stop.lat),
      lng: Number(stop.lng),
      directionLabel: stop.direction || stop.accessDirection || '',
      isAutoReady: stop.qaStatus === 'auto-ready',
      isRoadReady: ['auto-ready','road-ready-direction-hidden','service-road-ready'].includes(stop.qaStatus),
      searchableText: [
        stop.name, officialName, stop.road, roadName, stop.operator,
        nearestPlace, district, county, stop.region, stop.postcode, outwardCode,
        ...(stop.categoryFlags || [])
      ].filter(Boolean).join(' ').toLowerCase()
    };
  }

  function applyFilters(stops, filters={}) {
    return stops.filter(s => {
      const f = s.facilities || {};
      const has = v => v === true || v === 'yes' || v === 'paid';
      if (filters.toilets && !has(f.toilets)) return false;
      if (filters.fuel && !has(f.fuel)) return false;
      if (filters.hgv && !has(f.hgvParking ?? f.hgv_parking)) return false;
      if (filters.ev && !has(f.evCharging ?? f.ev_charging)) return false;
      if (filters.food && !has(f.food)) return false;
      if (filters.coffee && !has(f.coffee)) return false;
      if (filters.shop && !has(f.shop)) return false;
      if (filters.showers && !has(f.showers)) return false;
      if (filters.hotel && !has(f.hotel)) return false;
      return true;
    });
  }

  function search(stops, query) {
    const q = (query || '').trim().toLowerCase();
    if (!q) return stops;
    return stops.filter(s => s.searchableText.includes(q));
  }

  async function load() {
    const res = await fetch(DATA_URL, {cache:'no-store'});
    if (!res.ok) throw new Error('Unable to load ' + DATA_URL + ' (' + res.status + ')');
    const raw = await res.json();
    const stops = raw.map(normalizeStop);

    window.RESTSTOP_DATA = {
      stops,
      search: q => search(stops, q),
      filter: filters => applyFilters(stops, filters),
      nearby(lat, lng, radiusMiles=25, filters={}) {
        return applyFilters(stops, filters)
          .map(s => ({...s, distanceMiles: milesBetween(lat, lng, s.lat, s.lng)}))
          .filter(s => s.distanceMiles <= radiusMiles)
          .sort((a,b) => a.distanceMiles - b.distanceMiles);
      },
      stats: {
        total: stops.length,
        services: stops.filter(s => s.type === 'services').length,
        restAreas: stops.filter(s => s.type === 'rest_area').length,
        laybys: stops.filter(s => s.type === 'layby').length
      }
    };

    document.dispatchEvent(new CustomEvent('reststop:data-ready', {detail: window.RESTSTOP_DATA}));
    console.info('[RestStop UK] Real dataset loaded:', window.RESTSTOP_DATA.stats);
  }

  load().catch(err => {
    console.error('[RestStop UK] Dataset load failed:', err);
    window.RESTSTOP_DATA_ERROR = err;
    document.dispatchEvent(new CustomEvent('reststop:data-error', {detail: err}));
  });
})();
</script>

<script id="phase8c-real-results-bridge">
/* =========================================================
   Phase 8C — connect the existing interface UI to real data.
   ========================================================= */
(function(){
  const STATIC_ROAD_KEYS = {
    'M1':'m1','M6':'m6','M62':'m62','A1':'a1','A1(M)':'a1',
    'A14':'a14','A16':'a16','A17':'a17','A52':'a52'
  };
  const REAL_ROAD_BY_KEY = Object.create(null);

  const val = v => (v === true || v === 'yes' || v === 'paid') ? true : (v === false || v === 'no') ? false : null;
  const tri = v => (v === true || v === 'yes' || v === 'paid') ? 'yes' : (v === false || v === 'no') ? 'no' : 'unknown';
  const roadKey = label => 'real-' + String(label||'road').toLowerCase()
    .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');

  function mapRealStop(s){
    const road = s.road || 'Road not confirmed';
    const staticKey = STATIC_ROAD_KEYS[road] || null;
    const f = s.facilities || {};
    return L({
      id:s.id,
      name:s.name || s.officialName || s.official_name || 'Rest stop',
      slug:s.slug,
      lat:Number(s.lat),
      lon:Number(s.lng),
      road,
      roads: staticKey ? [staticKey] : [],
      direction:s.direction || null,
      direction_note:null,
      location_type:(s.type || s.location_type) === 'services' ? 'road_services' : (s.type || s.location_type || 'rest_area'),
      operator:s.operator || null,
      opening_hours:s.openingHours || s.opening_hours || null,
      source:'OpenStreetMap',
      last_verified:'2026-09',
      regions:[],
      toilets:val(f.toilets),
      fuel:val(f.fuel),
      food:val(f.food),
      coffee:val(f.coffee),
      shop:val(f.shop),
      ev_charging:val(f.evCharging ?? f.ev_charging),
      showers:val(f.showers),
      hotel:val(f.hotel),
      hgv_parking:val(f.hgvParking ?? f.hgv_parking),
      motorhome_parking:val(f.motorhomeParking ?? f.motorhome_parking ?? s.motorhomeParking ?? s.motorhome_parking),
      overnight_parking:val(f.overnightParking ?? f.overnight_parking ?? s.overnightParking ?? s.overnight_parking),
      car_parking:true,
      road_confidence:s.roadConfidence || null,
      direction_confidence:s.directionConfidence || null,
      qa_status:s.qaStatus || null,
      osm_url:s.source?.osmUrl || null,
      official_name:s.officialName || null,
      postcode:s.postcode || null,
      nearest_place:s.nearestPlace || s.nearest_place || null,
      district:s.district || s.local_authority || null,
      county:s.county || s.county_or_area || null,
      region:s.region || null,
      outward_code:s.outwardCode || null,
      geo_source:s.geoSource || null,
      _facilities:{
        toilets:tri(f.toilets),
        fuel:tri(f.fuel),
        food:tri(f.food),
        coffee:tri(f.coffee),
        shop:tri(f.shop),
        ev_charging:tri(f.evCharging ?? f.ev_charging),
        showers:tri(f.showers),
        hotel:tri(f.hotel),
        drinking_water:tri(f.drinkingWater ?? f.drinking_water),
        sanitary_dump:tri(f.sanitaryDump ?? f.sanitary_dump),
        hgv_parking:tri(f.hgvParking ?? f.hgv_parking),
        motorhome_parking:tri(f.motorhomeParking ?? f.motorhome_parking ?? s.motorhomeParking ?? s.motorhome_parking),
        overnight_parking:tri(f.overnightParking ?? f.overnight_parking ?? s.overnightParking ?? s.overnight_parking)
      }
    });
  }

  function ensureRoad(label){
    if(!label) return null;
    if(STATIC_ROAD_KEYS[label]) return STATIC_ROAD_KEYS[label];

    const key = roadKey(label);
    if(ROADS[key]) return key;

    const stops = LOCATIONS.filter(l => l.road === label);
    if(!stops.length) return null;

    const lats=stops.map(s=>s.lat), lons=stops.map(s=>s.lon);
    const ns=Math.max(...lats)-Math.min(...lats);
    const ew=Math.max(...lons)-Math.min(...lons);
    const axis=ns>=ew?'ns':'ew';
    const sorted=[...stops].sort((a,b)=>axis==='ns'?a.lat-b.lat:a.lon-b.lon);
    const step=Math.max(1,Math.floor(sorted.length/12));
    const path=sorted.filter((_,i)=>i%step===0 || i===sorted.length-1).map(s=>[s.lat,s.lon]);

    ROADS[key]={
      label,
      kind:/^M\d/i.test(label)?'m':'a',
      from:axis==='ns'?'South':'West',
      to:axis==='ns'?'North':'East',
      axis,
      path:path.length>1?path:[[stops[0].lat,stops[0].lon],[stops[0].lat+.01,stops[0].lon+.01]]
    };
    REAL_ROAD_BY_KEY[key]=label;
    for(const l of stops) if(!l.roads.includes(key)) l.roads.push(key);
    return key;
  }

  function installRealData(data){
    const mapped = data.stops.map(mapRealStop);

    LOCATIONS.splice(0, LOCATIONS.length, ...mapped);
    for(const k of Object.keys(BY_SLUG)) delete BY_SLUG[k];
    Object.assign(BY_SLUG, Object.fromEntries(LOCATIONS.map(l=>[l.slug,l])));

    // Replace search suggestions so road and stop lookup use the national dataset.
    suggestions = function(q){
      const n=q.trim(); if(!n) return null;
      const U=n.toUpperCase().replace(/\s+/g,''), low=n.toLowerCase();
      const g={roads:[],places:[],stops:[]};

      const seen=new Set();
      for(const l of LOCATIONS){
        const label=l.road;
        if(!label || label==='Road not confirmed') continue;
        const compact=label.toUpperCase().replace(/\s+/g,'');
        if((compact.startsWith(U) || label.toLowerCase().includes(low)) && !seen.has(label)){
          seen.add(label);
          const key=ensureRoad(label);
          if(key) g.roads.push({
            href:`#road-${key}`,
            html:`<span class="road ${ROADS[key].kind}">${esc(label)}</span>`,
            sub:`${LOCATIONS.filter(x=>x.road===label).length} real stops`
          });
        }
        if(g.roads.length>=8) break;
      }

      // Keep the interface's known place/postcode helpers for the current MVP.
      const pc=U.match(/^([A-Z]{1,2}\d[A-Z\d]?)(\d[A-Z]{2})?$/);
      if(pc && OUTWARD[pc[1]]) {
        const k=OUTWARD[pc[1]];
        g.places.push({place:k,label:`${pc[1]}${pc[2]?' '+pc[2]:''}, ${PLACES[k][0]}`,
          html:`${ic('pin',20)}<b>${pc[1]}${pc[2]?' '+pc[2]:''}</b>&nbsp;${PLACES[k][0]}`,sub:'Postcode'});
      }
      for(const [k,p] of Object.entries(PLACES)){
        if(p[0].toLowerCase().startsWith(low))
          g.places.push({place:k,html:`${ic('pin',20)}${esc(p[0])}`,sub:REGIONS[p[3]].name});
      }

      for(const l of LOCATIONS){
        if(l.name.toLowerCase().includes(low) || (l.official_name||'').toLowerCase().includes(low)){
          g.stops.push({href:`#loc-${l.slug}`,html:`${ic(l.location_type==='layby'?'parking':'pin',20)}${esc(l.name)}`,
            sub:`${esc(l.road)}${S.user?` · ${fmt(distFrom(l))} mi`:''}`});
          if(g.stops.length>=8) break;
        }
      }
      return g;
    };

    // Robust location page for records that do not belong to the old demo road/region model.
    locPage = function(slug){
      const l=BY_SLUG[slug]; if(!l) return notFound();
      const d=distFrom(l), st=openStatus(l.opening_hours);
      const verifiedFacs=facList(l);
      const fact=(label,value)=>value?`<div><small>${label}</small><b>${esc(value)}</b></div>`:'';
      return `<div class="wrap">
        ${crumbs([`<span aria-current="page">${esc(l.name)}</span>`])}
        <header class="phd">
          <div class="signrow">${l.road && l.road!=='Road not confirmed'?roadChips(l.road):''}<h1>${esc(l.name)}</h1></div>
          <p>${TYPES[l.location_type]?.label||'Rest stop'}${l.direction?` · ${esc(l.direction)}`:''}</p>
          <div class="facts">
            ${d!=null?`<span><b>${fmt(d)} mi</b> away</span>`:''}
            <span><b>${esc(st.text)}</b></span>
            ${l.operator?`<span>Operator <b>${esc(l.operator)}</b></span>`:''}
          </div>
          <div class="btns" style="margin-top:14px">
            <a class="btn go" data-primary-directions href="${gmaps(l)}" target="_blank" rel="noopener">${ic('nav',20)}Get directions</a>
          </div>
        </header>
        <section class="detail-grid">
          <div>
            <section class="panel"><h2>Facilities</h2>
              ${verifiedFacs.length?facIcons(l,18):'<p>No facilities are confirmed in the current OpenStreetMap data.</p>'}
              <p class="note">Unknown facilities are not shown as unavailable.</p>
            </section>
            <section class="panel"><h2>Location information</h2>
              <div class="facts">
                ${fact('Road',l.road!=='Road not confirmed'?l.road:null)}
                ${fact('Direction',l.direction)}
                ${fact('Operator',l.operator)}
                ${fact('Opening hours',l.opening_hours)}
              </div>
              <p class="note">Source: OpenStreetMap${l.osm_url?` · <a href="${l.osm_url}" target="_blank" rel="noopener">View source</a>`:''}</p>
            </section>
          </div>
          <aside><div class="mapwrap" data-map="m0"></div></aside>
        </section>
        <div class="sticky-dir" data-sticky-directions hidden><a class="btn go" href="${gmaps(l)}" target="_blank" rel="noopener">${ic('nav',20)}Directions</a></div>
      </div>`;
    };

    // Real location map for the custom detail page.
    const oldRender=render;
    render = function(keep){
      oldRender(keep);
      if(S.route.startsWith('loc-')){
        const l=BY_SLUG[S.route.slice(4)];
        if(l){
          const host=app.querySelector('[data-map="m0"]');
          if(host && !host.querySelector('.map')){
            const mv=new MapView(host,{items:[l],user:S.user,single:true,onSelect:null});
            MAPS.push(mv);
          }
        }
      }
    };

    document.documentElement.dataset.realData='ready';
    console.info('[RestStop UK Phase 8C] Interface switched to real records:', LOCATIONS.length);
    render(false);
  }

  document.addEventListener('reststop:data-ready', e => installRealData(e.detail), {once:true});

  // If the Phase 8B loader finished before this bridge executed.
  if(window.RESTSTOP_DATA?.stops?.length) installRealData(window.RESTSTOP_DATA);
})();
</script>

<script id="phase8e-real-map">
/* ============================================================
   Phase 8E — Leaflet + OpenStreetMap
   ============================================================ */
(function(){
  const Leaf = window.RestStopLeaflet;

  function titleCaseDirection(v){
    if(!v) return '';
    return String(v).charAt(0).toUpperCase()+String(v).slice(1);
  }

  function improveGeneratedNames(){
    if(typeof LOCATIONS==='undefined') return;
    for(const l of LOCATIONS){
      if(l.official_name) continue;
      const road = l.road && l.road!=='Road not confirmed' ? l.road : null;
      const dir = l.direction ? titleCaseDirection(l.direction) : null;

      if(l.location_type==='layby'){
        l.name = [road,dir,'Lay-by'].filter(Boolean).join(' ') || 'Lay-by';
      }else if(l.location_type==='rest_area'){
        l.name = [road,dir,'Rest Area'].filter(Boolean).join(' ') || 'Rest Area';
      }else if(l.location_type==='road_services'){
        if(l.operator && road) l.name=`${l.operator} ${road} Services`;
        else if(road) l.name=`${road} Services`;
        else l.name='Services';
      }
    }
    if(typeof BY_SLUG!=='undefined'){
      for(const l of LOCATIONS) BY_SLUG[l.slug]=l;
    }
  }

  function markerLetter(l){
    if(l.location_type==='layby') return 'P';
    if(l.location_type==='road_services') return 'S';
    return 'R';
  }

  function markerClass(l){
    if(l.location_type==='layby') return 'layby';
    if(l.location_type==='road_services') return 'services';
    return 'rest_area';
  }

  function iconFor(l,selected=false){
    return Leaf.divIcon({
      className:'rs-marker-wrap',
      html:`<div class="rs-marker ${markerClass(l)}${selected?' selected':''}">${markerLetter(l)}</div>`,
      iconSize:[34,34],
      iconAnchor:[17,17]
    });
  }

  class RealMapView {
    constructor(host,{items=[],user=null,road=null,single=false,onSelect=null}={}){
      Object.assign(this,{host,items,user,road,single,onSelect,sel:S.selected,hl:null,markers:new Map()});

      host.querySelectorAll('.map,.map-ctrl,.map-attr,.map-legend,.leaflet-reststop-map,.rs-map-fallback')
        .forEach(el=>el.remove());

      if(!Leaf){
        host.insertAdjacentHTML('afterbegin',
          '<div class="rs-map-fallback"><div><b>Map library unavailable.</b><br>Check your internet connection and reload.</div></div>');
        return;
      }

      const el=document.createElement('div');
      el.className='leaflet-reststop-map';
      host.insertBefore(el,host.firstChild);
      this.el=el;

      this.map=Leaf.map(el,{
        zoomControl:true,
        attributionControl:true,
        scrollWheelZoom:true,
        tap:true
      });

      Leaf.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
        maxZoom:19,
        attribution:'&copy; OpenStreetMap contributors'
      }).addTo(this.map);

      if(this.user){
        const ui=Leaf.divIcon({className:'rs-marker-wrap',html:'<div class="rs-user"></div>',iconSize:[22,22],iconAnchor:[11,11]});
        this.userMarker=Leaf.marker([this.user.lat,this.user.lon],{icon:ui,keyboard:false})
          .addTo(this.map)
          .bindTooltip(this.user.label||'Search location',{direction:'top'});
      }

      for(const l of items){
        const marker=Leaf.marker([l.lat,l.lon],{
          icon:iconFor(l,l.slug===this.sel),
          title:l.name,
          riseOnHover:true
        }).addTo(this.map);

        marker.bindTooltip(
          `<b>${esc(l.name)}</b>${l.road&&l.road!=='Road not confirmed'?`<br>${esc(l.road)}`:''}`,
          {direction:'top',offset:[0,-12]}
        );

        marker.on('click',()=>{
          this.select(l.slug);
          if(this.onSelect) this.onSelect(l.slug);
        });
        this.markers.set(l.slug,{marker,location:l});
      }

      this.fit();
      setTimeout(()=>this.map.invalidateSize(),30);
    }

    fit(){
      if(!this.map) return;
      const pts=[];
      for(const l of this.items) pts.push([l.lat,l.lon]);
      if(this.user && (!this.single || !this.items[0] || distFrom(this.items[0],this.user)<60))
        pts.push([this.user.lat,this.user.lon]);

      if(!pts.length){
        this.map.setView([52.9,-1.2],7);
      }else if(pts.length===1){
        this.map.setView(pts[0],this.single?15:13);
      }else{
        this.map.fitBounds(Leaf.latLngBounds(pts),{padding:[34,34],maxZoom:this.single?15:13});
      }
    }

    select(slug){
      this.sel=slug;
      for(const [s,o] of this.markers){
        o.marker.setIcon(iconFor(o.location,s===slug));
      }
      const hit=this.markers.get(slug);
      if(hit && this.single) this.map.panTo(hit.marker.getLatLng());
    }

    highlight(slug){
      this.hl=slug;
      const hit=this.markers.get(slug);
      if(hit) hit.marker.openTooltip();
      else for(const o of this.markers.values()) o.marker.closeTooltip();
    }
  }

  function activate(){
    improveGeneratedNames();

    if(typeof MapView!=='undefined'){
      MapView = RealMapView;
      console.info('[RestStop UK Phase 8E] Real OpenStreetMap view enabled.');
    }

    // Force a clean render so existing schematic instances are discarded.
    if(typeof render==='function') render(false);
  }

  if(window.RESTSTOP_DATA?.stops?.length){
    // Let Phase 8C finish replacing LOCATIONS first.
    setTimeout(activate,0);
  }else{
    document.addEventListener('reststop:data-ready',()=>setTimeout(activate,0),{once:true});
  }
})();
</script>

<script id="phase8g-geo-ui">
(function(){
  const GEO_INDEX={regions:new Map(),counties:new Map()};

  const slugGeo = s => String(s||'').toLowerCase()
    .replace(/&/g,' and ')
    .replace(/[^a-z0-9]+/g,'-')
    .replace(/^-+|-+$/g,'');

  function addGeo(map,name,l){
    if(!name) return null;
    const slug=slugGeo(name);
    if(!slug) return null;
    if(!map.has(slug)) map.set(slug,{slug,name,items:[]});
    map.get(slug).items.push(l);
    return slug;
  }

  function buildGeoIndex(){
    GEO_INDEX.regions.clear();
    GEO_INDEX.counties.clear();

    for(const l of LOCATIONS){
      const regionSlug=addGeo(GEO_INDEX.regions,l.region,l);
      const countySlug=addGeo(GEO_INDEX.counties,l.county||l.district,l);

      // Preserve the old interface contract while using real geographic membership.
      l.regions=[];
      if(regionSlug) l.regions.push(regionSlug);
      if(countySlug) l.regions.push(`county-${countySlug}`);
    }

    console.info('[RestStop UK Phase 8G] Geo index:',{
      regions:GEO_INDEX.regions.size,
      counties:GEO_INDEX.counties.size
    });
  }

  function geoContext(l){
    const bits=[];
    if(l.nearest_place) bits.push(l.nearest_place);
    if(l.county && l.county!==l.nearest_place) bits.push(l.county);
    else if(l.district && l.district!==l.nearest_place) bits.push(l.district);
    if(l.region && !bits.includes(l.region)) bits.push(l.region);
    return bits;
  }

  function geoLine(l){
    const bits=geoContext(l);
    if(!bits.length) return '';
    return `<p class="geo-line">${ic('pin',15)}${bits.map(x=>esc(x)).join(' · ')}</p>`;
  }

  // Richer cards: preserve all existing behaviour, add geographic context.
  cardHTML = function(l,{compact=false}={}){
    const d=distFrom(l), st=openStatus(l.opening_hours);
    if(compact){
      const f=facList(l).slice(0,4).map(x=>x[1]).join(' · ');
      return `<article class="card compact sel" data-slug="${l.slug}">
        <div class="top"><div style="min-width:0"><h3><a href="#loc-${l.slug}">${esc(l.name)}</a></h3>
        <div class="meta">${roadChips(l.road)}${dirBadge(l.direction)}</div>${geoLine(l)}</div>${distHTML(d)}</div>
        <p class="note">${f||'No facilities confirmed yet'}</p>
        <div class="btns"><a class="btn go sm" href="${gmaps(l)}" target="_blank" rel="noopener">${ic('nav',20)}Directions</a>
        <a class="btn sm" href="#loc-${l.slug}">View details</a></div></article>`;
    }
    return `<article class="card${S.selected===l.slug?' sel':''}" data-slug="${l.slug}">
      <div class="top"><div style="min-width:0"><h3><a href="#loc-${l.slug}">${esc(l.name)}</a></h3>
      <div class="meta">${roadChips(l.road)}${dirBadge(l.direction)}</div>${geoLine(l)}</div>${distHTML(d)}</div>
      <div class="row"><span class="type">${(TYPES[l.location_type]||{label:"Rest stop"}).label}</span><span class="status ${st.state}">${st.text}</span></div>
      ${facIcons(l)}
      <div class="btns"><a class="btn go sm" href="${gmaps(l)}" target="_blank" rel="noopener">${ic('nav',20)}Directions</a>
      <a class="btn sm" href="#loc-${l.slug}">View details</a></div>
    </article>`;
  };

  // Real region/county pages.
  regionPage = function(s){
    let entry=null, kind='Region';

    if(s.startsWith('county-')){
      entry=GEO_INDEX.counties.get(s.slice(7));
      kind='County / district';
    }else{
      entry=GEO_INDEX.regions.get(s);
    }

    if(!entry) return notFound();

    const items=entry.items;
    const roads=[...new Set(items.map(l=>l.road).filter(Boolean))];
    const intro=`${items.length} known RestStop UK locations in ${entry.name}. ${roads.length ? `Includes stops on ${roads.slice(0,8).join(', ')}${roads.length>8?' and more':''}.` : ''}`;

    return listingPage({
      crumb:[`<a href="#regions">Regions</a>`,`<span aria-current="page">${esc(entry.name)}</span>`],
      title:`Rest Areas in ${esc(entry.name)}`,
      intro,
      items,
      after:''
    });
  };

  // Replace regions index with real data.
  const previousIndexPage=indexPage;
  indexPage = function(k){
    if(k!=='regions') return previousIndexPage(k);

    const regions=[...GEO_INDEX.regions.values()].sort((a,b)=>b.items.length-a.items.length || a.name.localeCompare(b.name));
    const counties=[...GEO_INDEX.counties.values()].sort((a,b)=>b.items.length-a.items.length || a.name.localeCompare(b.name));

    return `<div class="wrap">${crumbs(['<span aria-current="page">Regions</span>'])}
      <header class="phd"><h1>Rest areas by region</h1>
      <p>Browse the real England dataset by region or county/district.</p>
      <div class="facts"><span><b>${regions.length}</b> regions</span><span><b>${counties.length}</b> counties / districts</span></div></header>
      <section class="browse"><div><h2>Regions</h2><div class="geo-grid">
        ${regions.map(r=>`<a href="#region-${r.slug}"><b>${esc(r.name)}</b><small>${r.items.length} stops</small></a>`).join('')}
      </div></div></section>
      <section class="browse"><div><h2>Counties &amp; districts</h2><div class="geo-grid">
        ${counties.map(r=>`<a href="#region-county-${r.slug}"><b>${esc(r.name)}</b><small>${r.items.length} stops</small></a>`).join('')}
      </div></div></section>
    </div>`;
  };

  // Region/county autocomplete is implemented independently below.
  // Do not reference Phase 8D's localGroups/renderBox functions because they are private
  // to that earlier IIFE.

  // Geo-rich location detail page.
  const geoLocPage = function(slug){
    const l=BY_SLUG[slug]; if(!l) return notFound();
    const d=distFrom(l), st=openStatus(l.opening_hours);
    const regionSlug=l.region?slugGeo(l.region):null;
    const countyName=l.county||l.district||null;
    const countySlug=countyName?slugGeo(countyName):null;

    const fact=(label,value)=>value?`<div><small>${label}</small><b>${esc(value)}</b></div>`:'';

    return `<div class="wrap">
      ${crumbs([
        regionSlug?`<a href="#region-${regionSlug}">${esc(l.region)}</a>`:'<a href="#regions">Regions</a>',
        countySlug?`<a href="#region-county-${countySlug}">${esc(countyName)}</a>`:'',
        `<span aria-current="page">${esc(l.name)}</span>`
      ].filter(Boolean))}
      <header class="phd">
        <div class="signrow">${l.road&&l.road!=='Road not confirmed'?roadChips(l.road):''}<h1>${esc(l.name)}</h1></div>
        ${geoLine(l)}
        <p>${TYPES[l.location_type]?.label||'Rest stop'}${l.direction?` · ${esc(l.direction)}`:''}</p>
        <div class="facts">
          ${d!=null?`<span><b>${fmt(d)} mi</b> away</span>`:''}
          <span><b>${esc(st.text)}</b></span>
          ${l.operator?`<span>Operator <b>${esc(l.operator)}</b></span>`:''}
        </div>
        <div class="btns" style="margin-top:14px">
          <a class="btn go" data-primary-directions href="${gmaps(l)}" target="_blank" rel="noopener">${ic('nav',20)}Get directions</a>
        </div>
      </header>

      <section class="detail-grid">
        <div>
          <section class="panel"><h2>Facilities</h2>
            ${facList(l).length?facIcons(l,18):'<p>No facilities are confirmed in the current OpenStreetMap data.</p>'}
            <p class="note">Unknown facilities are not shown as unavailable.</p>
          </section>

          <section class="panel"><h2>Location</h2>
            <div class="facts">
              ${fact('Nearest place',l.nearest_place)}
              ${fact('Postcode',l.postcode)}
              ${fact('County / district',countyName)}
              ${fact('Region',l.region)}
              ${fact('Road',l.road!=='Road not confirmed'?l.road:null)}
              ${fact('Direction',l.direction)}
            </div>
            <p class="note">Geographic context is derived from the nearest postcode record; it is not necessarily the stop's postal address.</p>
          </section>

          <section class="panel"><h2>Source</h2>
            <p>Rest-stop source: OpenStreetMap.${l.osm_url?` <a href="${l.osm_url}" target="_blank" rel="noopener">View OSM object</a>.`:''}</p>
          </section>
        </div>
        <aside><div class="mapwrap" data-map="m0"></div></aside>
      </section>
      <div class="sticky-dir" data-sticky-directions hidden><a class="btn go" href="${gmaps(l)}" target="_blank" rel="noopener">${ic('nav',20)}Directions</a></div>
    </div>`;
  };

  function activateGeo(){
    buildGeoIndex();

    // Phase 8C installs its own legacy locPage inside the asynchronous data-ready
    // handler. Reinstall the geographic detail page here AFTER that handler finishes.
    window.RESTSTOP_GEO_LOC_PAGE = geoLocPage;
    locPage = geoLocPage;

    render(false);
  }

  if(window.RESTSTOP_DATA?.stops?.length) setTimeout(activateGeo,0);
  else document.addEventListener('reststop:data-ready',()=>setTimeout(activateGeo,0),{once:true});
})();
</script>


<script id="phase8g1-search-geo-fix">
(function(){
  function slugGeoFix(s){
    return String(s||'').toLowerCase()
      .replace(/&/g,' and ')
      .replace(/[^a-z0-9]+/g,'-')
      .replace(/^-+|-+$/g,'');
  }

  function areaMatches(q){
    const low=String(q||'').trim().toLowerCase();
    if(!low || typeof LOCATIONS==='undefined') return [];

    const buckets=new Map();

    for(const l of LOCATIONS){
      const candidates=[
        {kind:'Region',name:l.region,prefix:'region-'},
        {kind:'County / district',name:l.county||l.district,prefix:'region-county-'}
      ];

      for(const c of candidates){
        if(!c.name || !c.name.toLowerCase().includes(low)) continue;
        const slug=slugGeoFix(c.name);
        const key=c.prefix+slug;

        if(!buckets.has(key)){
          buckets.set(key,{
            href:'#'+key,
            name:c.name,
            kind:c.kind,
            count:0
          });
        }
        buckets.get(key).count++;
      }
    }

    return [...buckets.values()]
      .sort((a,b)=>b.count-a.count || a.name.localeCompare(b.name))
      .slice(0,6);
  }

  // Add region/county choices into the existing autocomplete DOM after Phase 8D renders it.
  document.addEventListener('input',e=>{
    const inp=e.target.closest('form[data-search] input');
    if(!inp) return;

    const form=inp.closest('form');
    const q=inp.value.trim();

    setTimeout(()=>{
      const box=form.querySelector('.sugg');
      if(!box || box.hidden || !q) return;

      box.querySelectorAll('[data-phase8g-area]').forEach(n=>n.remove());

      const matches=areaMatches(q);
      if(!matches.length) return;

      const frag=document.createDocumentFragment();
      const h=document.createElement('h4');
      h.dataset.phase8gArea='1';
      h.textContent='Regions & counties';
      frag.appendChild(h);

      for(const m of matches){
        const a=document.createElement('a');
        a.dataset.phase8gArea='1';
        a.setAttribute('role','option');
        a.href=m.href;
        a.innerHTML=`${ic('pin',20)}${esc(m.name)}<small>${esc(m.kind)} · ${m.count} stops</small>`;
        frag.appendChild(a);
      }

      box.insertBefore(frag,box.firstChild);
    },330);
  },true);

  // Make area links navigate reliably.
  app.addEventListener('click',e=>{
    const a=e.target.closest('a[data-phase8g-area]');
    if(!a) return;
    e.preventDefault();
    e.stopImmediatePropagation();

    const hash=a.getAttribute('href');
    if(hash){
      location.hash=hash.slice(1);
    }
  },true);

  console.info('[RestStop UK v2.6.1] Geo search augmentation enabled without private Phase 8D references.');
})();
</script>
