<script id="phase9a19-uk-search-rebuild">
/* ============================================================
   RestStop UK Phase 9A.19 — UK-wide search rebuild
   Preview-only validation implementation.

   Primary:
     Postcodes.io — postcode + UK place lookup
   Fallback for towns/cities:
     Nominatim / OpenStreetMap, restricted to GB/UK country code
   Roads and stop-name results:
     existing local RestStop UK search logic

   Important:
     No country === "United Kingdom" filter is used.
     Location application writes directly to S.user and rerenders.
   ============================================================ */
(function(){
  const POSTCODES='https://api.postcodes.io';
  const NOMINATIM='https://nominatim.openstreetmap.org/search';
  let timer=null;
  let controller=null;
  const cache=new Map();

  function abortableFetch(url, timeout=7000){
    const c=new AbortController();
    const t=setTimeout(()=>c.abort(), timeout);
    return fetch(url,{
      signal:c.signal,
      headers:{'Accept':'application/json'}
    }).finally(()=>clearTimeout(t));
  }

  function looksPostcode(q){
    return /^[A-Z]{1,2}\d[A-Z\d]?\s*\d?[A-Z]{0,2}$/i.test(q.trim());
  }

  function looksFullPostcode(q){
    return /^[A-Z]{1,2}\d[A-Z\d]?\s*\d[A-Z]{2}$/i.test(q.trim());
  }

  function compactPostcode(q){
    return q.toUpperCase().replace(/\s+/g,'');
  }

  function roadLike(q){
    return /^(M|A|B)\s*\d+/i.test(q.trim());
  }

  function applyLocation(lat,lon,label){
    const la=Number(lat), lo=Number(lon);
    if(!Number.isFinite(la) || !Number.isFinite(lo)) return false;

    S.roadQuery=null;
    S.user={
      lat:la,
      lon:lo,
      label:label || 'Search location',
      kind:'postcode-place'
    };
    S.denied=false;
    S.loading=false;
    S.selected=null;
    S.scrollResults=true;
    S.radius=25;

    if(route()!=='home'){
      location.hash='home';
    }else{
      render(false);
    }

    // A second paint avoids stale map instances from the old example location.
    setTimeout(()=>{
      if(route()==='home'){
        render(false);
      }
    },0);

    return true;
  }

  window.__restStopApplyUKLocation=applyLocation;

  function geoLink(item){
    const label=item.label || 'Search location';
    const sub=item.sub || 'United Kingdom';
    return `<a role="option" href="#home"
      data-uk-geo="1"
      data-geo-lat="${item.lat}"
      data-geo-lon="${item.lon}"
      data-geo-label="${esc(label)}">
      ${ic('pin',20)}<b>${esc(label)}</b><small>${esc(sub)}</small>
    </a>`;
  }

  function localHtml(q){
    try{
      const g=suggestions(q);
      if(!g) return '';

      const sections=[];
      if(g.roads && g.roads.length){
        sections.push(`<h4>Roads</h4>${g.roads.slice(0,6).map(x=>
          `<a role="option" href="${x.href||'#home'}">${x.html}<small>${esc(x.sub||'')}</small></a>`
        ).join('')}`);
      }
      if(g.stops && g.stops.length){
        sections.push(`<h4>Stops</h4>${g.stops.slice(0,6).map(x=>
          `<a role="option" href="${x.href||'#home'}">${x.html}<small>${esc(x.sub||'')}</small></a>`
        ).join('')}`);
      }
      return sections.join('');
    }catch(e){
      return '';
    }
  }

  function show(form,q,geo=[],message=''){
    const box=form.querySelector('.sugg');
    if(!box) return;

    const local=localHtml(q);
    const places=geo.length
      ? `<h4>Places & postcodes</h4>${geo.slice(0,6).map(geoLink).join('')}`
      : '';

    box.innerHTML=local+places+(message?`<p class="none">${esc(message)}</p>`:'');
    box.hidden=false;

    const inp=form.querySelector('input');
    if(inp) inp.setAttribute('aria-expanded','true');
  }

  async function postcodeResults(q){
    const out=[];
    try{
      const res=await abortableFetch(
        `${POSTCODES}/postcodes?q=${encodeURIComponent(q)}&limit=6`
      );
      if(res.ok){
        const body=await res.json();
        for(const p of body.result||[]){
          if(p.latitude==null || p.longitude==null) continue;
          out.push({
            label:p.postcode || q.toUpperCase(),
            lat:p.latitude,
            lon:p.longitude,
            sub:[p.admin_district,p.region,p.country].filter(Boolean).join(' · ')
          });
        }
      }
    }catch(e){}
    return out;
  }

  async function postcodesPlaceResults(q){
    const out=[];
    try{
      const res=await abortableFetch(
        `${POSTCODES}/places?q=${encodeURIComponent(q)}&limit=8`
      );
      if(res.ok){
        const body=await res.json();
        for(const p of body.result||[]){
          if(p.latitude==null || p.longitude==null) continue;
          const name=[p.name_1,p.name_2].filter(Boolean).join(' / ');
          if(!name) continue;
          out.push({
            label:name,
            lat:p.latitude,
            lon:p.longitude,
            sub:[
              p.local_type,
              p.county_unitary||p.district_borough,
              p.region,
              p.country
            ].filter(Boolean).join(' · ')
          });
        }
      }
    }catch(e){}
    return out;
  }

  async function nominatimPlaceResults(q){
    const out=[];
    try{
      const url=
        `${NOMINATIM}?format=jsonv2&countrycodes=gb&limit=6`+
        `&addressdetails=1&q=${encodeURIComponent(q)}`;

      const res=await abortableFetch(url,7000);
      if(res.ok){
        const body=await res.json();
        for(const p of body||[]){
          if(p.lat==null || p.lon==null) continue;
          const a=p.address||{};
          const label=
            a.city || a.town || a.village || a.hamlet ||
            a.municipality || p.name ||
            (p.display_name ? p.display_name.split(',')[0] : q);

          const sub=[
            p.type,
            a.county,
            a.state,
            a.country
          ].filter(Boolean).join(' · ');

          out.push({
            label,
            lat:p.lat,
            lon:p.lon,
            sub
          });
        }
      }
    }catch(e){}
    return out;
  }

  function unique(items){
    const seen=new Set();
    const out=[];
    for(const x of items){
      const key=
        `${String(x.label).toLowerCase()}|`+
        `${Number(x.lat).toFixed(4)}|${Number(x.lon).toFixed(4)}`;
      if(seen.has(key)) continue;
      seen.add(key);
      out.push(x);
    }
    return out;
  }

  async function geoSearch(q){
    const clean=q.trim();
    const key=clean.toLowerCase();
    if(cache.has(key)) return cache.get(key);

    let out=[];

    if(looksPostcode(clean)){
      out.push(...await postcodeResults(clean));
    }

    if(!roadLike(clean)){
      out.push(...await postcodesPlaceResults(clean));

      // This fallback is essential for places not returned consistently
      // by the Postcodes.io places endpoint.
      if(out.length<3){
        out.push(...await nominatimPlaceResults(clean));
      }
    }

    out=unique(out).slice(0,8);
    cache.set(key,out);
    return out;
  }

  async function exactResolve(q){
    const clean=q.trim();

    if(looksFullPostcode(clean)){
      try{
        const res=await abortableFetch(
          `${POSTCODES}/postcodes/${encodeURIComponent(compactPostcode(clean))}`
        );
        if(res.ok){
          const body=await res.json();
          const p=body.result;
          if(p && p.latitude!=null && p.longitude!=null){
            return {
              label:p.postcode||clean.toUpperCase(),
              lat:p.latitude,
              lon:p.longitude,
              sub:[p.admin_district,p.region,p.country].filter(Boolean).join(' · ')
            };
          }
        }
      }catch(e){}
    }

    const all=await geoSearch(clean);
    if(!all.length) return null;

    const low=clean.toLowerCase();
    return all.find(x=>String(x.label).toLowerCase()===low) || all[0];
  }

  // Input/autocomplete: capture before legacy handlers.
  document.addEventListener('input',function(e){
    const input=e.target.closest && e.target.closest('form[data-search] input');
    if(!input) return;

    const form=input.form;
    const q=input.value.trim();

    clearTimeout(timer);
    if(controller){try{controller.abort()}catch(_e){}}
    controller=new AbortController();

    if(q.length<2){
      const box=form.querySelector('.sugg');
      if(box) box.hidden=true;
      return;
    }

    // Show local road/stop matches immediately.
    show(form,q,[],'Searching UK…');

    timer=setTimeout(async()=>{
      const results=await geoSearch(q);
      if(input.value.trim()!==q) return;
      show(
        form,
        q,
        results,
        results.length ? '' :
          'No matching UK place yet. Try a postcode, town, road or stop name.'
      );
    },220);
  },true);

  // Direct geo-result clicks.
  document.addEventListener('click',function(e){
    const a=e.target.closest && e.target.closest('a[data-uk-geo="1"]');
    if(!a) return;

    e.preventDefault();
    e.stopPropagation();
    e.stopImmediatePropagation();

    applyLocation(
      a.dataset.geoLat,
      a.dataset.geoLon,
      a.dataset.geoLabel || 'Search location'
    );
  },true);

  // Search button / Enter.
  document.addEventListener('submit',async function(e){
    const form=e.target.closest && e.target.closest('form[data-search]');
    if(!form) return;

    e.preventDefault();
    e.stopPropagation();
    e.stopImmediatePropagation();

    const input=form.querySelector('input');
    const q=input ? input.value.trim() : '';
    if(!q) return;

    // Preserve existing road navigation.
    if(roadLike(q)){
      try{
        const g=suggestions(q);
        if(g && g.roads && g.roads.length){
          location.hash=(g.roads[0].href||'#home').replace(/^#/,'');
          if(!location.hash.startsWith('#')) location.hash='#'+location.hash;
          return;
        }
      }catch(_e){}
    }

    show(form,q,[],'Finding that location…');

    const result=await exactResolve(q);
    if(result){
      applyLocation(result.lat,result.lon,result.label);
    }else{
      show(
        form,
        q,
        [],
        `We couldn't locate “${q}” in the UK. Try a postcode, town, road, or stop name.`
      );
    }
  },true);

  console.info('[RestStop UK Phase 9A.19] UK-wide search rebuild enabled.');
})();
</script>

<script id="phase10a-ga4-product-analytics">
(function(){
  function track(name,params){ if(typeof window.rsukTrack==='function') window.rsukTrack(name,params||{}); }
  function cleanText(el){ return (el?.textContent||'').replace(/\s+/g,' ').trim().slice(0,120); }
  function stopContext(el){
    const card=el?.closest?.('.card');
    const slug=card?.dataset?.slug || '';
    const title=card?.querySelector?.('h3')?.textContent?.trim() || '';
    return {stop_id:slug||undefined,stop_name:title||undefined,source_page:location.pathname+location.hash};
  }

  document.addEventListener('submit',function(e){
    const form=e.target.closest?.('form[data-search]');
    if(!form) return;
    const q=form.querySelector('input')?.value?.trim();
    if(q) track('search',{search_term:q,source_page:location.pathname+location.hash});
  },true);

  document.addEventListener('click',function(e){
    const el=e.target.closest?.('a,button');
    if(!el) return;

    const action=el.dataset?.action;
    if(action==='locate'){
      track('use_location',{source_page:location.pathname+location.hash});
      return;
    }
    if(action==='fac' || action==='type' || action==='radius' || action==='dir' || action==='roadf' || action==='clear'){
      track('filter_apply',{
        filter_type:action,
        filter_value:el.dataset?.k || el.dataset?.r || el.dataset?.d || el.dataset?.v || cleanText(el),
        source_page:location.pathname+location.hash
      });
      return;
    }

    const href=el.getAttribute?.('href')||'';
    const text=cleanText(el).toLowerCase();
    if(/google\.[^/]+\/maps|maps\.google|google\.com\/maps/.test(href) || text.includes('directions')){
      track('directions_click',stopContext(el));
      return;
    }
    if(href.startsWith('#loc-') || text==='view details'){
      track('view_details',Object.assign(stopContext(el),{target:href||undefined}));
    }
  },true);

  function renderConsent(){
    let saved=null; try{saved=localStorage.getItem(window.RSUK_ANALYTICS_CONSENT_KEY);}catch(_e){}
    if(saved) return;
    const bar=document.createElement('div');
    bar.id='rsuk-analytics-consent';
    bar.setAttribute('role','dialog');
    bar.setAttribute('aria-label','Analytics preferences');
    bar.style.cssText='position:fixed;left:14px;right:14px;bottom:14px;z-index:9999;max-width:920px;margin:auto;background:var(--surface,#fff);color:var(--ink,#111);border:1px solid var(--line,#d3d9d4);border-radius:16px;box-shadow:0 10px 34px rgba(0,0,0,.22);padding:18px 20px;font:16px/1.55 system-ui,sans-serif';
    bar.innerHTML='<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><div style="flex:1;min-width:280px"><strong style="display:block;margin-bottom:5px;font-size:18px;line-height:1.25">Help us improve RestStop UK</strong><span style="display:block;max-width:62ch">We use Google Analytics only if you accept, to understand searches, filters and navigation. You can reject analytics and keep using the site normally.</span></div><div style="display:flex;gap:10px;flex-wrap:wrap"><button type="button" data-rsuk-consent="denied" class="btn sm" style="min-height:46px;padding-inline:16px">Reject</button><button type="button" data-rsuk-consent="granted" class="btn go sm" style="min-height:46px;padding-inline:18px">Accept analytics</button></div></div>';
    document.body.appendChild(bar);
    bar.addEventListener('click',function(e){
      const b=e.target.closest('[data-rsuk-consent]');
      if(!b) return;
      window.rsukSetAnalyticsConsent?.(b.dataset.rsukConsent);
      bar.remove();
    });
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',renderConsent,{once:true}); else renderConsent();
})();
</script>
</body></html>
