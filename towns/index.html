<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rest Areas by Town | RestStop UK</title>
<meta name="description" content="Browse RestStop UK town and locality pages.">
<link rel="canonical" href="https://reststopuk.co.uk/towns/">
<meta name="robots" content="index,follow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{--ink:#111916;--muted:#58645f;--green:#087943;--line:#d9dedb;--bg:#f3f5f3;--card:#fff}
*{box-sizing:border-box}
body{margin:0;font:16px/1.55 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:var(--bg)}
a{color:#075f3a}
header,main,footer{max-width:1120px;margin:auto;padding:20px}
.brand{font-size:22px;font-weight:900;text-decoration:none;color:var(--ink)}
.brand b{background:var(--green);color:#fff;padding:3px 7px;border-radius:7px;margin-left:4px}
.crumbs{font-size:14px;color:var(--muted);margin:10px 0 20px}.crumbs a{color:inherit}
.hero{padding:20px 0 10px}.hero h1{font-size:clamp(32px,5vw,52px);line-height:1.05;margin:.2em 0}.hero p{max-width:760px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}.card h2,.card h3{margin:0 0 8px}
.meta{color:var(--muted);font-size:14px}
.btn{display:inline-block;background:var(--green);color:#fff;text-decoration:none;font-weight:800;border-radius:10px;padding:10px 14px;margin-top:10px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.stats span{background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 11px}
section{margin:28px 0}
footer{color:var(--muted);font-size:13px;border-top:1px solid var(--line);margin-top:40px}
</style>
</head>
<body>
<header><a class="brand" href="/">RestStop <b>UK</b></a></header>
<main>
<div class="crumbs"><a href="/">Home</a> › Towns</div>
<div class="hero"><h1>Rest Areas by Town</h1><p>Town-level pages are currently available for Wales where the source data provides sufficient locality information.</p></div>
<div class="grid"><article class="card"><h2><a href="/towns/wales/">Wales</a></h2><p class="meta">56 town and locality pages</p></article></div>
</main>
<footer>RestStop UK · UK-wide rest-stop directory.</footer>
</body>
</html>
